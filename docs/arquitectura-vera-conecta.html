<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arquitectura de Vera y Vera Conecta</title>
<style>
  body{margin:0;background:#f7f6f2;color:#222;font:16px system-ui,sans-serif}
  main{max-width:1200px;margin:auto;padding:40px} h1{font-size:28px;margin:0 0 8px}
  p{color:#555;margin:0 0 28px} svg{width:100%;height:auto;background:white;border:1px solid #d8d6cf;border-radius:16px}
  .zone{fill:#fafafa;stroke:#aaa;stroke-width:2}.local{fill:#f0f7f2;stroke:#5e8568}.service{fill:#f2f5fa;stroke:#56739b}
  .client{fill:#fff5df;stroke:#a97924}.store{fill:#f4eff8;stroke:#76548f}.node{stroke-width:2;rx:10}
  .title{font-weight:700;font-size:18px}.small{font-size:14px;fill:#555}.arrow{fill:none;stroke:#4c5864;stroke-width:2.5;marker-end:url(#arrow)}
</style>
<main>
  <h1>Una instancia de Vera y sus caminos de acceso</h1>
  <p>Vera Conecta transporta sobres; la autoridad, la memoria y Cotito permanecen junto a Vera.</p>
  <svg viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
    <title id="title">Arquitectura de Vera Conecta</title>
    <desc id="desc">Clientes locales y remotos acceden a una instancia Vera. Vera Conecta sólo transporta datos sin conservarlos.</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4c5864"/></marker></defs>

    <path class="arrow" d="M250 145 C360 145 390 250 475 250"/>
    <path class="arrow" d="M250 305 C330 305 365 295 475 295"/>
    <path class="arrow" d="M250 485 C340 485 350 380 475 380"/>
    <path class="arrow" d="M685 295 C760 295 785 295 850 295"/>
    <path class="arrow" d="M955 345 C955 395 955 420 955 455"/>

    <rect class="zone client node" x="50" y="90" width="200" height="110"/>
    <text x="150" y="130" text-anchor="middle" class="title">PWA de Vera</text>
    <text x="150" y="158" text-anchor="middle" class="small">interfaz humana</text>
    <text x="150" y="180" text-anchor="middle" class="small">local o remota</text>

    <rect class="zone client node" x="50" y="250" width="200" height="110"/>
    <text x="150" y="290" text-anchor="middle" class="title">Vera Clip</text>
    <text x="150" y="318" text-anchor="middle" class="small">captura estrecha</text>
    <text x="150" y="340" text-anchor="middle" class="small">alcance capture</text>

    <rect class="zone client node" x="50" y="430" width="200" height="110"/>
    <text x="150" y="470" text-anchor="middle" class="title">Agentes remotos</text>
    <text x="150" y="498" text-anchor="middle" class="small">ChatGPT · Claude</text>
    <text x="150" y="520" text-anchor="middle" class="small">MCP autorizado</text>

    <rect class="zone service" x="435" y="180" width="290" height="280" rx="18"/>
    <text x="580" y="215" text-anchor="middle" class="title">Vera Conecta</text>
    <rect class="service node" x="475" y="235" width="210" height="120"/>
    <text x="580" y="275" text-anchor="middle" class="title">Relay</text>
    <text x="580" y="303" text-anchor="middle" class="small">autentica · encamina</text>
    <text x="580" y="325" text-anchor="middle" class="small">no conserva contenido</text>
    <text x="580" y="405" text-anchor="middle" class="small">Servicio alojado separable</text>
    <text x="580" y="428" text-anchor="middle" class="small">de la máquina de Vera</text>

    <rect class="zone local" x="810" y="75" width="300" height="500" rx="18"/>
    <text x="960" y="112" text-anchor="middle" class="title">Instancia de Vera</text>
    <text x="960" y="136" text-anchor="middle" class="small">hoy puede vivir completa en Alexei</text>
    <rect class="local node" x="850" y="175" width="210" height="170"/>
    <text x="955" y="215" text-anchor="middle" class="title">Vera</text>
    <text x="955" y="246" text-anchor="middle" class="small">API y operaciones</text>
    <text x="955" y="270" text-anchor="middle" class="small">autoridad de escritura</text>
    <text x="955" y="294" text-anchor="middle" class="small">conector saliente</text>
    <rect class="store node" x="850" y="455" width="210" height="80"/>
    <text x="955" y="488" text-anchor="middle" class="title">Grafo local</text>
    <text x="955" y="514" text-anchor="middle" class="small">SQLite · adjuntos</text>
    <rect class="local node" x="850" y="365" width="210" height="65"/>
    <text x="955" y="393" text-anchor="middle" class="title">Cotito</text>
    <text x="955" y="416" text-anchor="middle" class="small">participante autorizado</text>
  </svg>
</main>
</html>
